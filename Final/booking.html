<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TechnoArmor | Home page</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet"> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header>
        <div class="container py-3">
            <div class="row align-items-center">
                <div class="col-12 col-md-4 text-center text-md-start">
                    <h1 class="logo-title">Scrub-A-Dog</h1>
                    <p class="logo-sub">Clean Pets. Clean Owners.</p>
                </div>
                <div class="col-12 col-md-8">
                    <nav class="navbar navbar-expand-md navbar-dark">
                        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                            <ul class="navbar-nav">
                                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                                <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                            </ul>
                        </div>

                    </nav>
                </div>

            </div>
        </div>
        </header>
        <div>
            <img src="dog-banner.jpg" class="banner-img" alt="Dog Banner">
        </div>
    <!-- Content goes here -->
        <main class="container">
            <div class="grooming-title mt-5">Grooming Rates</div>
            <form action="booking.html" method="POST">

            <div class="row g-4">

            <div class="col-12 col-md-6">
                <fieldset class="form_style">
                    <legend>Customer Information</legend>

                    <label for="firstName" class="form-label">First Name:</label>
                    <input type="text" id="firstName" name="firstName" class="form-control">

                    <label for="lastName" class="form-label">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" class="form-control">

                    <label for="petName" class="form-label">Pet's Name:</label>
                    <input type="text" id="petName" name="petName" class="form-control">

                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control">

                    <label for="phone" class="form-label">Phone:</label>
                    <input type="tel" id="phone" name="phone" class="form-control">

                    <label for="date" class="form-label">Date:</label>
                    <input type="date" id="date" name="date" class="form-control">
                </fieldset>
            </div>
            <div class="col-12 col-md-6">
                <fieldset class="form_style">
                    <legend>Service Request</legend>

                    <p>I would like the following service:</p>

                    <input class="form-check-input" type="radio" id="basic" name="service" value="Basic Groom">
                    <label for="basic" class="form-check-label">Basic Groom</label>

                    <input class="form-check-input" type="radio" id="full" name="service" value="Full Groom">
                    <label for="full" class="form-check-label">Full Groom</label>

                    <input class="form-check-input" type="radio" id="pampered" name="service" value="Pampered Groom">
                    <label for="pampered" class="form-check-label">Pampered Groom</label>

                    <label for="groomer" class="form-label">Preferred Groomer</label>
                        <select id="groomer" name="groomer" class="form-select">
                            <option>No preference</option>
                            <option>Sarah</option>
                            <option>Michael</option>
                            <option>Jenna</option>
                            <option>Roberto</option>
                        </select>

                    <label for="special" class="form-label">Special requests or instructions</label>
                    <textarea id="special" name="special" rows="4" class="form-control"></textarea>
                </fieldset>
            </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Submit</button>
            </div>

            </form>

        </main>
    <!-- End of content -->
        <footer>
            <p>© Copyright 2024. All Rights Reserved.</p>
            <p>contact@polipaws.net</p>
        </footer>
    </body>
</html>
